<meta name="robots" content="noindex">

<title>Thought to Shipped</title>
<link rel="stylesheet" href="flow-style.css">

<body>
<canvas class="net" id="net" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header>
    <div>
      <h1 id="title">Thought to Shipped</h1>
      <p class="tag" id="tagline"></p>
    </div>
    <div class="tools" role="group" aria-label="Controls">
      <button class="btn" id="replay" type="button">&#9654; Replay</button>
      <button class="btn" id="slow" type="button" aria-pressed="false">Slow-mo: off</button>
      <button class="btn" id="theme" type="button" aria-label="Switch theme">Theme: dark</button>
    </div>
  </header>

  <div class="bands" id="bands" aria-label="Pipeline groups"></div>
  <nav class="rail" id="rail" aria-label="Pipeline stages"></nav>

  <div class="thought" aria-live="polite">
    <span class="lbl" id="thought-label"></span>
    <q id="thought-text"></q>
    <span id="pills" style="display:contents"></span>
  </div>

  <div class="main">
    <section class="stage-wrap" id="stages" aria-label="Current stage"></section>
    <aside class="logbox" aria-label="Live log">
      <h3><span>LIVE LOG</span><span class="live" id="livetag">&#9679; idle</span></h3>
      <div class="log" id="log"></div>
    </aside>
  </div>

  <footer>
    <div class="legend" id="legend"></div>
    <div><span id="source"></span> &middot; Keys: space replay &middot; S slow-mo &middot; &larr; &rarr; step</div>
  </footer>
</div>
